[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-trading-suite"
version = "5.11.0"
description = "Systematic Gamma Exposure (GEX) Options & Agentic Portfolio Trading Suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GEX Engineering Team"}
]
keywords = ["trading", "options", "gex", "gamma-exposure", "mcp", "robinhood"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
gex = "src.gex_engine:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by black/formatter style
    "E701",  # multiple statements on one line
    "E731",  # do not assign a lambda expression (used for proxy forwarding)
    "E741",  # ambiguous variable name
    "F401",  # unused imports across package init exports and compatibility re-exports
    "F541",  # f-string without placeholders
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
files = ["src/gex"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["src.gex.core.*"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["src.gex.quant.*"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["src.gex.risk.*"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "src.gex.cli.*",
    "src.gex.presentation.*",
    "src.gex.storage.*",
    "src.gex.screening.*",
    "src.gex.backtest.*",
]
ignore_errors = true
